<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Maqueta 3D de Jujuy</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #17191d;
        color: #e8e9eb;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #overlay > * {
        pointer-events: auto;
      }
      .webgpu-notice {
        box-sizing: border-box;
        max-width: 34rem;
        margin: 10vh auto 0;
        padding: 1.25rem 1.5rem;
        border-radius: 0.75rem;
        background: #23262c;
        box-shadow: 0 0.5rem 2rem rgb(0 0 0 / 0.45);
        line-height: 1.5;
      }
      .webgpu-notice h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }
      .webgpu-notice p {
        margin: 0.5rem 0;
      }
      .webgpu-notice .detail {
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        color: #9aa3b2;
        word-break: break-word;
      }
      .attributions {
        position: absolute;
        left: 0.5rem;
        bottom: 0.5rem;
        max-width: min(26rem, calc(100vw - 1rem));
        padding: 0.4rem 0.6rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.8);
        font-size: 0.72rem;
        color: #b9bec7;
      }
      .attributions summary {
        cursor: pointer;
        font-weight: 600;
        outline: none;
      }
      .attributions ul {
        margin: 0.35rem 0 0;
        padding-left: 1rem;
      }
      .attributions a {
        color: #8fc1ff;
      }
      .loading-message {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
        padding: 0.6rem 1.1rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.85);
        font-size: 0.95rem;
        color: #d7dae0;
      }
      .terrain-controls {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0.6rem 0.75rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.8);
        font-size: 0.78rem;
        color: #d7dae0;
      }
      .terrain-controls .exaggeration {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .terrain-controls .exaggeration input[type="range"] {
        width: 7rem;
      }
      .terrain-controls .exaggeration-value {
        min-width: 2.2rem;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .terrain-controls .quality-toggle {
        align-self: flex-start;
        color: #8fc1ff;
      }
      @media (max-width: 640px) {
        .attributions {
          font-size: 0.66rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
