<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Maqueta 3D de Jujuy</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #17191d;
        color: #e8e9eb;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #overlay > * {
        pointer-events: auto;
        /* no double-tap zoom on the UI; pinch zoom still works on text */
        touch-action: manipulation;
      }
      .webgpu-notice {
        box-sizing: border-box;
        max-width: 34rem;
        margin: calc(10vh + env(safe-area-inset-top)) auto 0;
        padding: 1.25rem 1.5rem;
        border-radius: 0.75rem;
        background: #23262c;
        box-shadow: 0 0.5rem 2rem rgb(0 0 0 / 0.45);
        line-height: 1.5;
      }
      .webgpu-notice-reload {
        display: block;
        min-width: 44px;
        min-height: 44px;
        margin-top: 0.9rem;
        padding: 0 1.4rem;
        border: none;
        border-radius: 0.5rem;
        background: #4f7ec4;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .webgpu-notice-reload:hover {
        background: #5d8cd6;
      }
      .webgpu-notice h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }
      .webgpu-notice p {
        margin: 0.5rem 0;
      }
      .webgpu-notice .detail {
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        color: #9aa3b2;
        word-break: break-word;
      }
      .attributions {
        position: absolute;
        left: calc(0.5rem + env(safe-area-inset-left));
        bottom: calc(0.5rem + env(safe-area-inset-bottom));
        max-width: min(26rem, calc(100vw - 1rem));
        padding: 0.4rem 0.6rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.8);
        font-size: 0.72rem;
        color: #b9bec7;
      }
      .attributions summary {
        cursor: pointer;
        font-weight: 600;
        outline: none;
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      .attributions ul {
        margin: 0.35rem 0 0;
        padding-left: 1rem;
      }
      .attributions a {
        color: #8fc1ff;
      }
      .loading-message {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
        padding: 0.6rem 1.1rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.85);
        font-size: 0.95rem;
        color: #d7dae0;
      }
      .terrain-controls {
        position: absolute;
        top: calc(0.5rem + env(safe-area-inset-top));
        right: calc(0.5rem + env(safe-area-inset-right));
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0.6rem 0.75rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.8);
        font-size: 0.78rem;
        color: #d7dae0;
      }
      .terrain-controls .exaggeration {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .terrain-controls .exaggeration input[type="range"] {
        width: 7rem;
        /* the input box is the touch hit area for the thumb */
        height: 44px;
      }
      .terrain-controls .exaggeration-value {
        min-width: 2.2rem;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .terrain-controls .quality-toggle {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: #8fc1ff;
      }
      .terrain-controls .quality-warning {
        margin: 0;
        max-width: 12rem;
        font-size: 0.7rem;
        color: #e3b567;
      }
      .pick-panel {
        position: absolute;
        right: calc(0.5rem + env(safe-area-inset-right));
        bottom: calc(0.5rem + env(safe-area-inset-bottom));
        max-width: min(16rem, calc(100vw - 1rem));
        padding: 0.55rem 0.75rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.85);
        font-size: 0.8rem;
        color: #d7dae0;
      }
      .pick-panel-close {
        position: absolute;
        top: 0;
        right: 0;
        width: 44px;
        height: 44px;
        border: none;
        background: none;
        color: #9aa3b2;
        font-size: 1rem;
        line-height: 1;
        padding: 0;
        cursor: pointer;
      }
      .pick-panel-close:hover {
        color: #e8e9eb;
      }
      .pick-panel [hidden] {
        display: none;
      }
      .pick-panel-data {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.1rem 0.6rem;
        margin: 0 2rem 0 0;
      }
      .pick-panel-data dt {
        color: #9aa3b2;
      }
      .pick-panel-data dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .pick-panel-note,
      .pick-panel-hint {
        margin: 0.4rem 0 0;
        font-size: 0.68rem;
        color: #9aa3b2;
      }
      .regions-controls {
        position: absolute;
        top: calc(0.5rem + env(safe-area-inset-top));
        left: calc(0.5rem + env(safe-area-inset-left));
        max-width: min(15rem, calc(100vw - 1rem));
        padding: 0.5rem 0.65rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.8);
        font-size: 0.78rem;
        color: #d7dae0;
      }
      .regions-controls [hidden] {
        display: none;
      }
      .regions-toggle {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        min-height: 44px;
        cursor: pointer;
      }
      .regions-toggle input {
        width: 1.1rem;
        height: 1.1rem;
        flex: none;
      }
      .regions-legend {
        list-style: none;
        margin: 0.1rem 0 0;
        padding: 0;
      }
      .region-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
        min-height: 44px;
        padding: 0 0.2rem;
        border: none;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .region-item:hover .region-name {
        text-decoration: underline;
      }
      .region-swatch {
        width: 0.85rem;
        height: 0.85rem;
        border-radius: 0.2rem;
        flex: none;
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.3);
      }
      .region-card {
        position: relative;
        margin-top: 0.3rem;
        padding-top: 0.4rem;
        border-top: 1px solid rgb(255 255 255 / 0.12);
      }
      .region-card h3 {
        margin: 0 2rem 0.15rem 0;
        font-size: 0.92rem;
      }
      .region-card p {
        margin: 0.3rem 0;
      }
      .region-card-departments,
      .region-card-note {
        font-size: 0.7rem;
        color: #b9bec7;
      }
      .region-card-note {
        color: #e3b567;
      }
      .region-card-source {
        font-size: 0.7rem;
      }
      .region-card-source a {
        color: #8fc1ff;
      }
      .region-card-close {
        position: absolute;
        top: 0;
        right: -0.35rem;
        width: 44px;
        height: 44px;
        border: none;
        background: none;
        color: #9aa3b2;
        font-size: 1rem;
        line-height: 1;
        padding: 0;
        cursor: pointer;
      }
      .region-card-close:hover {
        color: #e8e9eb;
      }
      .debug-overlay {
        position: absolute;
        top: calc(0.5rem + env(safe-area-inset-top));
        left: calc(0.5rem + env(safe-area-inset-left));
        padding: 0.4rem 0.6rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.8);
        font-family: ui-monospace, monospace;
        font-size: 0.66rem;
        line-height: 1.45;
        color: #b9bec7;
        white-space: pre;
        pointer-events: none;
      }
      @media (max-width: 640px) {
        .attributions {
          font-size: 0.66rem;
        }
        /* Bottom sheet: anchored to the screen edge so the center of the
           map stays visible and reachable. */
        .pick-panel {
          left: 0;
          right: 0;
          bottom: 0;
          max-width: none;
          border-radius: 0.75rem 0.75rem 0 0;
          padding-bottom: calc(0.55rem + env(safe-area-inset-bottom));
        }
        .pick-panel-close {
          right: calc(0.25rem + env(safe-area-inset-right));
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
