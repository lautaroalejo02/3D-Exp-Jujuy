<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Maqueta 3D de Jujuy</title>
    <style>
      /* Design tokens: colors, radii, spacing, shadows, type sizes. The
         accent is a warm sand/terracotta that sits well over the satellite
         imagery; the cool counterpoint is reserved for links and focus. */
      :root {
        --font-ui:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        --font-mono:
          ui-monospace,
          "SF Mono",
          "Cascadia Mono",
          Consolas,
          monospace;
        --fs-xs: 0.72rem;
        --fs-sm: 0.8rem;
        --fs-md: 0.92rem;
        --fs-lg: 1.25rem;
        --text: #eef0f4;
        --text-dim: #aab1bd;
        /* Panels are translucent "glass" over the scene, with a nearly
           opaque fallback when backdrop-filter is unavailable. */
        --panel-bg: rgb(18 20 26 / 0.58);
        --panel-bg-solid: rgb(20 22 28 / 0.92);
        --panel-border: rgb(255 255 255 / 0.11);
        --panel-shadow: 0 10px 30px rgb(0 0 0 / 0.45);
        --panel-blur: blur(14px) saturate(1.25);
        --radius-panel: 0.9rem;
        --radius-sm: 0.55rem;
        --radius-pill: 999px;
        --control-bg: rgb(255 255 255 / 0.07);
        --control-bg-hover: rgb(255 255 255 / 0.14);
        --control-bg-active: rgb(255 255 255 / 0.18);
        /* Terracotta accent: AA contrast against --on-accent text. */
        --accent: #dd9663;
        --accent-hover: #e9ab7d;
        --on-accent: #26150a;
        --cool: #8fc1ff;
        --note: #eec078;
        --focus: rgb(143 193 255 / 0.95);
        --touch: 44px;
        --pad-panel: 0.65rem 0.8rem;
        --gap-panel: 0.5rem;
        /* Single z-index scale for the overlay UI, lowest to highest:
           map canvas < places layer (markers + labels, visual only) <
           panels/controls < mode sheet < detail sheet < mode bar <
           lightbox/modals < notices. Markers always render BELOW every
           panel. The mode bar tops the sheets: a minimized sheet extends
           down behind the bar and must not cover it. */
        --z-places: 1;
        --z-panels: 5;
        --z-sheets: 10;
        --z-detail: 12;
        --z-modebar: 14;
        --z-modals: 20;
        --z-notices: 30;
        /* Bottom thumb bar: 58px of controls plus the home-indicator
           safe area. Bottom sheets anchor right above it. */
        --mode-bar-h: calc(58px + env(safe-area-inset-bottom));
        /* Marker dot: a soft blue that reads over the warm satellite
           terrain, with a white ring. */
        --marker-fill: #7ba7de;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #17191d;
        color: var(--text);
        font-family: var(--font-ui);
      }
      #app {
        position: fixed;
        inset: 0;
        /* Map gestures are handled in JS; the browser must never pan or
           pinch-zoom the page. Scrollable panels (cards, lists) are their
           own scroll containers, so their touch-action still applies. */
        touch-action: none;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #overlay > * {
        pointer-events: auto;
        /* no double-tap zoom on the UI; pinch zoom still works on text */
        touch-action: manipulation;
      }
      /* Non-interactive overlay children must opt out with a selector
         that beats `#overlay > *` on specificity: a full-screen layer
         that keeps pointer events swallows every map touch, and iOS
         Safari then pinch-zooms the page instead of the camera. */
      #overlay > .places-layer,
      #overlay > .debug-overlay,
      #overlay > .loading-message {
        pointer-events: none;
        touch-action: none;
      }

      /* Shared panel chrome: translucent glass when the engine supports
         it, near-solid dark otherwise (the scene behind is bright and a
         transparent panel without blur would be unreadable). */
      .sheet,
      #mode-bar,
      #reset-view,
      .loading-message,
      .debug-overlay,
      .place-marker-label,
      .webgpu-notice {
        border: 1px solid var(--panel-border);
        background: var(--panel-bg-solid);
        box-shadow: var(--panel-shadow);
      }
      @supports (
        (backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))
      ) {
        .sheet,
        #mode-bar,
        #reset-view,
        .loading-message,
        .debug-overlay,
        .place-marker-label,
        .webgpu-notice {
          background: var(--panel-bg);
          -webkit-backdrop-filter: var(--panel-blur);
          backdrop-filter: var(--panel-blur);
        }
      }

      /* Pill buttons: one shape for every action control. */
      .quality-toggle,
      .regions-legend-reopen,
      .webgpu-notice-reload {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        min-height: var(--touch);
        padding: 0 1rem;
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-pill);
        background: var(--control-bg);
        color: var(--text);
        font: inherit;
        font-size: var(--fs-sm);
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
      }
      .quality-toggle:hover,
      .regions-legend-reopen:hover,
      .webgpu-notice-reload:hover {
        background: var(--control-bg-hover);
      }
      .quality-toggle:active,
      .regions-legend-reopen:active,
      .webgpu-notice-reload:active {
        background: var(--control-bg-active);
      }
      .quality-toggle:focus-visible,
      .regions-legend-reopen:focus-visible,
      .webgpu-notice-reload:focus-visible,
      .pick-panel-close:focus-visible,
      .region-card-close:focus-visible,
      .explorar-places-item:focus-visible,
      .region-item:focus-visible,
      .mode-tab:focus-visible,
      #reset-view:focus-visible,
      .attributions summary:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--focus);
      }
      /* The quality button is the one primary action on the panel. */
      .quality-toggle {
        align-self: flex-start;
        border-color: transparent;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }
      .quality-toggle:hover {
        background: var(--accent-hover);
      }

      .webgpu-notice {
        position: relative;
        z-index: var(--z-notices);
        box-sizing: border-box;
        max-width: 34rem;
        margin: calc(10vh + env(safe-area-inset-top)) auto 0;
        padding: 1.25rem 1.5rem;
        border-radius: var(--radius-panel);
        line-height: 1.5;
      }
      .webgpu-notice-reload {
        margin-top: 0.9rem;
        font-size: var(--fs-md);
      }
      .webgpu-notice h1 {
        margin: 0 0 0.75rem;
        font-size: var(--fs-lg);
      }
      .webgpu-notice p {
        margin: 0.5rem 0;
      }
      .webgpu-notice .detail {
        font-family: var(--font-mono);
        font-size: var(--fs-sm);
        color: var(--text-dim);
        word-break: break-word;
      }
      /* "Fuentes de datos": a section at the bottom of the Explorar
         sheet (the texts come verbatim from ATTRIBUTIONS.md). */
      .attributions {
        padding: 0.3rem 0.2rem 0;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .attributions summary {
        cursor: pointer;
        font-weight: 600;
        outline: none;
        min-height: var(--touch);
        display: flex;
        align-items: center;
        border-radius: var(--radius-sm);
      }
      .attributions ul {
        margin: 0.35rem 0 0;
        padding-left: 1rem;
      }
      .attributions a {
        color: var(--cool);
      }
      .loading-message {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
        padding: 0.6rem 1.2rem;
        border-radius: var(--radius-pill);
        font-size: var(--fs-md);
        color: var(--text);
        z-index: var(--z-notices);
      }
      /* The control sections live inside the Explorar sheet, so they
         are plain blocks — the sheet owns the glass chrome. */
      .terrain-controls {
        display: flex;
        flex-direction: column;
        gap: var(--gap-panel);
        padding: 0.35rem 0.2rem;
        font-size: var(--fs-sm);
        color: var(--text);
      }
      .terrain-controls .exaggeration {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 500;
      }
      /* Styled range slider, cross-browser incl. iOS Safari: the input
         box stays 44px tall as the touch hit area while the visual track
         is a thin line with a round thumb. WebKit tracks get their fill
         from the --fill custom property the JS keeps updated. */
      .terrain-controls .exaggeration input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        flex: 1;
        min-width: 0;
        /* the input box is the touch hit area for the thumb */
        height: var(--touch);
        margin: 0;
        background: transparent;
        cursor: pointer;
      }
      .terrain-controls .exaggeration input[type="range"]:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--focus);
        border-radius: var(--radius-pill);
      }
      .terrain-controls
        .exaggeration
        input[type="range"]::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(
          to right,
          var(--accent) 0%,
          var(--accent) var(--fill, 50%),
          rgb(255 255 255 / 0.18) var(--fill, 50%)
        );
      }
      .terrain-controls
        .exaggeration
        input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        margin-top: -7px; /* (track 6px - thumb 20px) / 2 */
        border: none;
        border-radius: 50%;
        background: #f4f1ec;
        box-shadow:
          0 0 0 2px var(--accent),
          0 1px 4px rgb(0 0 0 / 0.5);
      }
      .terrain-controls
        .exaggeration
        input[type="range"]::-moz-range-track {
        height: 6px;
        border-radius: 3px;
        background: rgb(255 255 255 / 0.18);
      }
      .terrain-controls
        .exaggeration
        input[type="range"]::-moz-range-progress {
        height: 6px;
        border-radius: 3px;
        background: var(--accent);
      }
      .terrain-controls
        .exaggeration
        input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border: none;
        border-radius: 50%;
        background: #f4f1ec;
        box-shadow:
          0 0 0 2px var(--accent),
          0 1px 4px rgb(0 0 0 / 0.5);
      }
      .terrain-controls .exaggeration-value {
        min-width: 2.2rem;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--text-dim);
      }
      .terrain-controls .quality-warning {
        margin: 0;
        max-width: 16rem;
        font-size: var(--fs-xs);
        color: var(--note);
      }
      /* Pick info / place card: content blocks inside the detail sheet —
         plain sections, the sheet owns position, size and chrome. */
      .pick-panel {
        position: relative;
        font-size: var(--fs-sm);
        color: var(--text);
      }
      .pick-panel-close,
      .region-card-close {
        position: absolute;
        top: 0;
        right: 0;
        width: var(--touch);
        height: var(--touch);
        border: none;
        border-radius: 50%;
        background: none;
        color: var(--text-dim);
        font-size: 1.05rem;
        line-height: 1;
        padding: 0;
        cursor: pointer;
      }
      .pick-panel-close:hover,
      .region-card-close:hover {
        color: var(--text);
        background: var(--control-bg);
      }
      .pick-panel [hidden] {
        display: none;
      }
      .pick-panel-data {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.1rem 0.6rem;
        margin: 0 2rem 0 0;
      }
      .pick-panel-data dt {
        color: var(--text-dim);
      }
      .pick-panel-data dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .pick-panel-note,
      .pick-panel-hint {
        margin: 0.4rem 0 0;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      /* Places layer: full-screen marker overlay, purely visual — marker
         taps are resolved by the canvas pick path (places.pickAt). Its
         pointer-events opt-out lives in the `#overlay > …` rule above,
         which out-specifies `#overlay > *`. */
      .places-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        /* Below every panel, sheet and notice: markers and labels are
           the lowest overlay content (see the --z-* scale in :root). */
        z-index: var(--z-places);
      }
      #overlay .place-marker {
        pointer-events: none;
        touch-action: none;
      }
      .place-marker {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
      }
      /* Marker: a small dot with a white ring and a soft shadow — the
         white ring keeps it readable over any terrain color. ~10 px CSS
         keeps the overview tidy; clusters group what would overlap. */
      .place-marker-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        margin: -6.5px 0 0 -6.5px;
        border-radius: 50%;
        background: var(--marker-fill);
        border: 1.5px solid #f8f9fb;
        box-shadow:
          0 1px 5px rgb(0 0 0 / 0.5),
          0 0 0 1px rgb(0 0 0 / 0.18);
        transition:
          width 0.15s ease,
          height 0.15s ease,
          margin 0.15s ease;
      }
      /* The place whose card is open: a bigger dot with an accent ring. */
      .place-marker--selected .place-marker-dot {
        width: 16px;
        height: 16px;
        margin: -9.5px 0 0 -9.5px;
        box-shadow:
          0 0 0 3px var(--accent),
          0 2px 7px rgb(0 0 0 / 0.55);
      }
      /* Cluster dot: a bigger circle with the member count inside —
         tapping it zooms in until the markers separate. */
      .place-marker--cluster .place-marker-dot {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        margin: -11.5px 0 0 -11.5px;
        transition: none;
      }
      .place-marker-count {
        color: #16202b;
        font-size: 0.66rem;
        font-weight: 700;
        line-height: 1;
      }
      .place-marker-label {
        position: absolute;
        top: 50%;
        left: 10px;
        transform: translateY(-50%);
        padding: 0.2rem 0.55rem;
        border-radius: var(--radius-pill);
        color: var(--text);
        font-size: var(--fs-xs);
        font-weight: 600;
        white-space: nowrap;
        pointer-events: none;
      }
      .place-marker-label--hidden {
        display: none;
      }
      /* Place card: reuses .pick-panel; card-specific bits only. The
         overlay layer is click-through, so the card opts back in and
         keeps normal scroll/pinch behavior. */
      .place-card {
        pointer-events: auto;
        touch-action: manipulation;
      }
      .place-card-desc {
        margin: 0.15rem 0 0.4rem;
        padding-right: 2rem;
        font-size: 0.75rem;
        line-height: 1.45;
        color: var(--text);
      }
      .place-card-desc--empty {
        color: var(--text-dim);
        font-style: italic;
      }
      .place-card-links {
        margin: 0.45rem 0 0;
        font-size: 0.75rem;
      }
      .place-card-links a {
        color: var(--cool);
      }
      /* The card fills the detail sheet's content width; the sheet's
         scroll region handles overflow. */
      .place-card {
        width: auto;
        max-width: none;
      }
      /* Photo strip: horizontal swipeable thumbnails, credit under each. */
      .place-card-photos {
        display: flex;
        gap: 0.6rem;
        margin: 0 1.8rem 0.45rem 0;
        overflow-x: auto;
        overscroll-behavior: contain;
        scroll-snap-type: x proximity;
        touch-action: pan-x;
        scrollbar-width: thin;
      }
      .place-card-photo {
        flex: none;
        scroll-snap-align: start;
        margin: 0;
      }
      .place-card-photo-button {
        display: block;
        padding: 0;
        border: none;
        border-radius: var(--radius-sm);
        background: #101216;
        cursor: zoom-in;
      }
      .place-card-photo-button img {
        display: block;
        height: 170px;
        width: auto;
        border-radius: var(--radius-sm);
      }
      .place-card-photo-button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .place-card-photo-credit {
        margin-top: 0.15rem;
        font-size: 0.62rem;
        color: var(--text-dim);
        white-space: nowrap;
      }
      .place-card-photo-credit a {
        color: var(--cool);
      }
      .place-card-more {
        display: inline-flex;
        align-items: center;
        min-height: var(--touch);
        padding: 0;
        border: none;
        background: none;
        color: var(--cool);
        font: inherit;
        font-size: 0.78rem;
        cursor: pointer;
      }
      .place-card-more::after {
        content: "▾";
        margin-left: 0.35rem;
      }
      .place-card-more[aria-expanded="true"]::after {
        content: "▴";
      }
      .place-card-extract {
        margin: 0.3rem 0 0;
        padding: 0.15rem 0 0.15rem 0.6rem;
        border-left: 3px solid rgb(143 193 255 / 0.5);
      }
      .place-card-extract p {
        margin: 0;
        font-size: 0.75rem;
        line-height: 1.5;
      }
      .place-card-extract-source {
        margin: 0.25rem 0 0;
        font-size: 0.68rem;
        color: var(--text-dim);
      }
      .place-card-extract-source a {
        color: var(--cool);
      }
      .place-card-facts {
        margin-top: 0.4rem;
      }
      .place-card-facts-source {
        margin: 0.25rem 0 0;
        font-size: 0.68rem;
        color: var(--text-dim);
      }
      .place-card-facts-source a {
        color: var(--cool);
      }
      /* Photo lightbox: full-screen dialog over the overlay, on the
         --z-modals tier (above sheets and panels). Its touch-action
         opt-out needs the #overlay > selector to out-specify
         `#overlay > *`, like .places-layer's. */
      #overlay > .photo-lightbox {
        touch-action: none;
      }
      .photo-lightbox {
        position: absolute;
        inset: 0;
        z-index: var(--z-modals);
        background: rgb(0 0 0 / 0.92);
      }
      .photo-lightbox[hidden] {
        display: none;
      }
      .photo-lightbox-stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* every gesture on the image goes to the pointer handlers
           (pan when zoomed, swipe to navigate, pinch to zoom) */
        touch-action: none;
      }
      .photo-lightbox-image {
        max-width: 94vw;
        max-height: 78vh;
        width: auto;
        height: auto;
        border-radius: var(--radius-sm);
      }
      .photo-lightbox-caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom));
        background: rgb(0 0 0 / 0.55);
        font-size: 0.72rem;
        color: var(--text-dim);
        text-align: center;
      }
      .photo-lightbox-caption a {
        color: var(--cool);
      }
      .photo-lightbox-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: var(--touch);
        height: 64px;
        border: none;
        border-radius: var(--radius-sm);
        background: rgb(23 25 29 / 0.6);
        color: var(--text);
        font-size: 1.6rem;
        cursor: pointer;
      }
      .photo-lightbox-prev {
        left: calc(0.5rem + env(safe-area-inset-left));
      }
      .photo-lightbox-next {
        right: calc(0.5rem + env(safe-area-inset-right));
      }
      .photo-lightbox-close {
        position: absolute;
        top: calc(0.5rem + env(safe-area-inset-top));
        right: calc(0.5rem + env(safe-area-inset-right));
        width: var(--touch);
        height: var(--touch);
        border: none;
        border-radius: var(--radius-pill);
        background: rgb(23 25 29 / 0.6);
        color: var(--text);
        font-size: 1.3rem;
        line-height: 1;
        cursor: pointer;
      }
      /* Explorar sheet: search field, the place list it filters, the
         "Mostrar lugares" switch and the section spacing. */
      .explorar {
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }
      .explorar-search {
        box-sizing: border-box;
        width: 100%;
        min-height: var(--touch);
        padding: 0 0.9rem;
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-pill);
        background: var(--control-bg);
        color: var(--text);
        font: inherit;
        font-size: var(--fs-md);
      }
      .explorar-search::placeholder {
        color: var(--text-dim);
      }
      .explorar-places {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .explorar-places-item {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        width: 100%;
        min-height: var(--touch);
        padding: 0 0.6rem;
        border: none;
        border-radius: var(--radius-sm);
        background: none;
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .explorar-places-item:hover {
        background: var(--control-bg);
      }
      .explorar-places-item:active {
        background: var(--control-bg-active);
      }
      .explorar-places-dept {
        margin-left: auto;
        padding-left: 0.5rem;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .explorar-empty {
        margin: 0;
        padding: 0 0.2rem;
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .regions-controls {
        padding: 0.35rem 0.2rem;
        font-size: var(--fs-sm);
        color: var(--text);
      }
      .regions-controls [hidden] {
        display: none;
      }
      .regions-toggle {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        min-height: var(--touch);
        font-weight: 600;
        cursor: pointer;
      }
      /* The "Regiones" toggle is a large pill switch: the checkbox is the
         whole track and ::after is the knob. */
      .regions-toggle input {
        -webkit-appearance: none;
        appearance: none;
        position: relative;
        width: 2.6rem;
        height: 1.5rem;
        flex: none;
        margin: 0;
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-pill);
        background: var(--control-bg-active);
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .regions-toggle input::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 0.18rem;
        width: 1.05rem;
        height: 1.05rem;
        margin-top: -0.53rem;
        border-radius: 50%;
        background: #f4f1ec;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.45);
        transition: left 0.15s ease;
      }
      .regions-toggle input:checked {
        border-color: transparent;
        background: var(--accent);
      }
      .regions-toggle input:checked::after {
        left: 1.32rem;
      }
      .regions-toggle input:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--focus);
      }
      .places-list-visible input {
        width: 1.15rem;
        height: 1.15rem;
        flex: none;
        accent-color: var(--accent);
      }
      /* The legend is dismissible: an explicit × closes it (the regions
         stay on) and a small "Leyenda" pill brings it back. */
      .regions-legend {
        position: relative;
        margin-top: 0.1rem;
      }
      .regions-legend-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.4rem;
        min-height: 1.6rem;
      }
      .regions-legend-title {
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .regions-legend-close {
        width: var(--touch);
        height: var(--touch);
        margin: -0.55rem -0.35rem -0.55rem 0;
        border: none;
        border-radius: 50%;
        background: none;
        color: var(--text-dim);
        font-size: 1.05rem;
        line-height: 1;
        padding: 0;
        cursor: pointer;
      }
      .regions-legend-close:hover {
        color: var(--text);
        background: var(--control-bg);
      }
      .regions-legend-close:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--focus);
      }
      .regions-legend-reopen {
        margin-top: 0.1rem;
      }
      .regions-legend-items {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .region-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
        min-height: var(--touch);
        padding: 0 0.4rem;
        border: none;
        border-radius: var(--radius-sm);
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .region-item:hover {
        background: var(--control-bg);
      }
      .region-item:active {
        background: var(--control-bg-active);
      }
      .region-swatch {
        width: 0.85rem;
        height: 0.85rem;
        border-radius: 0.25rem;
        flex: none;
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.3);
      }
      .region-card {
        position: relative;
        margin-top: 0.3rem;
        padding-top: 0.4rem;
        border-top: 1px solid var(--panel-border);
      }
      .region-card h3 {
        margin: 0 2rem 0.15rem 0;
        font-size: var(--fs-md);
      }
      .region-card p {
        margin: 0.3rem 0;
      }
      .region-card-departments,
      .region-card-note {
        font-size: var(--fs-xs);
        color: var(--text-dim);
      }
      .region-card-note {
        color: var(--note);
      }
      .region-card-source {
        font-size: var(--fs-xs);
      }
      .region-card-source a {
        color: var(--cool);
      }
      .region-card-close {
        right: -0.35rem;
      }
      .debug-overlay {
        position: absolute;
        top: calc(0.5rem + env(safe-area-inset-top));
        left: calc(0.5rem + env(safe-area-inset-left));
        padding: 0.4rem 0.6rem;
        border-radius: var(--radius-sm);
        font-family: var(--font-mono);
        font-size: 0.66rem;
        line-height: 1.45;
        color: var(--text-dim);
        white-space: pre;
        pointer-events: none;
        z-index: var(--z-notices);
      }
      /* --- Mode bar + bottom sheets (mobile-first) --------------------
         The bar sits in the thumb zone; each sheet anchors right above
         it at a fixed height and slides down with translateY so only the
         visible portion shows (JS writes the offset; 100% = hidden). */
      #mode-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: var(--z-modebar);
        display: flex;
        gap: 0.3rem;
        box-sizing: border-box;
        height: var(--mode-bar-h);
        padding: 0.35rem 0.5rem calc(0.35rem + env(safe-area-inset-bottom));
        border-top: 1px solid var(--panel-border);
      }
      .mode-tab {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.1rem;
        min-width: 0;
        border: none;
        border-radius: var(--radius-sm);
        background: none;
        color: var(--text-dim);
        font: inherit;
        font-size: 0.66rem;
        font-weight: 600;
        cursor: pointer;
      }
      .mode-tab svg {
        width: 1.4rem;
        height: 1.4rem;
      }
      .mode-tab:hover {
        background: var(--control-bg);
        color: var(--text);
      }
      .mode-tab[aria-pressed="true"] {
        background: var(--control-bg);
        color: var(--accent);
      }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: var(--mode-bar-h);
        display: flex;
        flex-direction: column;
        height: 88vh;
        height: 88dvh;
        max-height: calc(100vh - var(--mode-bar-h) - 0.5rem);
        max-height: calc(100dvh - var(--mode-bar-h) - 0.5rem);
        transform: translateY(100%);
        transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
        border-top: 1px solid var(--panel-border);
        border-radius: var(--radius-panel) var(--radius-panel) 0 0;
        overflow: hidden;
        color: var(--text);
        font-size: var(--fs-sm);
        z-index: var(--z-sheets);
        will-change: transform;
      }
      .sheet--detail {
        z-index: var(--z-detail);
      }
      .sheet--dragging {
        transition: none;
      }
      .sheet[hidden],
      .sheet [hidden] {
        display: none;
      }
      /* The handle row is the only drag surface — its ~64px are also
         the minimized snap, so the title stays readable when folded. */
      .sheet-head {
        flex: none;
        padding: 0.5rem 1rem 0.5rem;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .sheet-head:active {
        cursor: grabbing;
      }
      .sheet-grip {
        display: block;
        width: 2.6rem;
        height: 0.3rem;
        margin: 0 auto 0.5rem;
        border-radius: var(--radius-pill);
        background: rgb(255 255 255 / 0.35);
      }
      .sheet-title {
        margin: 0;
        font-size: var(--fs-md);
        font-weight: 600;
      }
      /* The content scrolls inside the sheet box — pan-y keeps sheet
         gestures off the map and overscroll keeps the page still. */
      .sheet-content {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        padding: 0.1rem 1rem 1rem;
      }
      .mode-placeholder {
        margin: 0.8rem 0.2rem;
        color: var(--text-dim);
        font-size: var(--fs-md);
      }
      /* Minimized mobile sheet: only the grip + title row stays visible.
         The content is clipped away so nothing peeks above the mode bar;
         while dragging the content stays on so the gesture reads live.
         clip-path (not visibility/display) is used so the clipped items
         keep their layout boxes: they stay attached and "visible" to
         probes and the accessibility tree without painting.
         (Desktop keeps the content: there the sheet is a static panel
         and data-snap has no visual meaning.) */
      @media (max-width: 1023.98px) {
        .sheet[data-snap="min"]:not(.sheet--dragging) .sheet-content {
          clip-path: inset(0 0 100% 0);
        }
      }
      /* Round "reset view" button, top-right — the only floating
         control left; the map stays the protagonist. */
      #reset-view {
        position: absolute;
        top: calc(0.6rem + env(safe-area-inset-top));
        right: calc(0.6rem + env(safe-area-inset-right));
        z-index: var(--z-panels);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: var(--touch);
        height: var(--touch);
        padding: 0;
        border-radius: 50%;
        color: var(--text);
        cursor: pointer;
      }
      #reset-view:hover {
        background: var(--control-bg-hover);
      }
      #reset-view svg {
        width: 1.4rem;
        height: 1.4rem;
      }
      @media (prefers-reduced-motion: reduce) {
        .sheet {
          transition: none;
        }
      }
      /* Desktop (>= 1024px): the same modes become a ~360px left panel
         with the tabs on top; the detail sheet docks inside it. The map
         keeps the rest of the screen. */
      @media (min-width: 1024px) {
        #mode-bar {
          top: 0;
          right: auto;
          bottom: auto;
          width: 22.5rem;
          height: 3.6rem;
          padding: 0.3rem 0.4rem;
          border-top: none;
          border-right: 1px solid var(--panel-border);
          border-bottom: 1px solid var(--panel-border);
        }
        .mode-tab {
          flex-direction: row;
          gap: 0.4rem;
          font-size: var(--fs-xs);
        }
        .mode-tab svg {
          width: 1.15rem;
          height: 1.15rem;
        }
        .sheet {
          top: 3.6rem;
          bottom: 0;
          left: 0;
          right: auto;
          width: 22.5rem;
          height: auto;
          max-height: none;
          transform: none !important;
          transition: none;
          border-top: none;
          border-right: 1px solid var(--panel-border);
          border-radius: 0;
          box-shadow: none;
        }
        .sheet-head {
          padding-top: 0.8rem;
          cursor: default;
        }
        .sheet-grip {
          display: none;
        }
        /* The detail sheet docks at the top of the panel, over the mode
           sheet's content — the place card shows inside the panel. */
        .sheet--detail {
          top: 3.6rem;
          bottom: auto;
          max-height: 72%;
          border-bottom: 1px solid var(--panel-border);
          border-radius: 0 0 var(--radius-panel) 0;
          box-shadow: var(--panel-shadow);
        }
        .debug-overlay {
          top: calc(4.1rem + env(safe-area-inset-top));
          left: calc(23rem + env(safe-area-inset-left));
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="overlay">
        <!-- The mode bar, the mode sheet and the detail sheet are built
             by src/ui/menu.ts on startup; the places layer, pick panel,
             place card and lightbox mount here too. -->
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
