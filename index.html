<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Maqueta 3D de Jujuy</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #17191d;
        color: #e8e9eb;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        /* Map gestures are handled in JS; the browser must never pan or
           pinch-zoom the page. Scrollable panels (cards, lists) are their
           own scroll containers, so their touch-action still applies. */
        touch-action: none;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #overlay > * {
        pointer-events: auto;
        /* no double-tap zoom on the UI; pinch zoom still works on text */
        touch-action: manipulation;
      }
      /* Non-interactive overlay children must opt out with a selector
         that beats `#overlay > *` on specificity: a full-screen layer
         that keeps pointer events swallows every map touch, and iOS
         Safari then pinch-zooms the page instead of the camera. */
      #overlay > .places-layer,
      #overlay > .debug-overlay,
      #overlay > .loading-message {
        pointer-events: none;
        touch-action: none;
      }
      .webgpu-notice {
        box-sizing: border-box;
        max-width: 34rem;
        margin: calc(10vh + env(safe-area-inset-top)) auto 0;
        padding: 1.25rem 1.5rem;
        border-radius: 0.75rem;
        background: #23262c;
        box-shadow: 0 0.5rem 2rem rgb(0 0 0 / 0.45);
        line-height: 1.5;
      }
      .webgpu-notice-reload {
        display: block;
        min-width: 44px;
        min-height: 44px;
        margin-top: 0.9rem;
        padding: 0 1.4rem;
        border: none;
        border-radius: 0.5rem;
        background: #4f7ec4;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .webgpu-notice-reload:hover {
        background: #5d8cd6;
      }
      .webgpu-notice h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }
      .webgpu-notice p {
        margin: 0.5rem 0;
      }
      .webgpu-notice .detail {
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        color: #9aa3b2;
        word-break: break-word;
      }
      .attributions {
        position: absolute;
        left: calc(0.5rem + env(safe-area-inset-left));
        bottom: calc(0.5rem + env(safe-area-inset-bottom));
        max-width: min(26rem, calc(100vw - 1rem));
        padding: 0.4rem 0.6rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.8);
        font-size: 0.72rem;
        color: #b9bec7;
      }
      .attributions summary {
        cursor: pointer;
        font-weight: 600;
        outline: none;
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      .attributions ul {
        margin: 0.35rem 0 0;
        padding-left: 1rem;
      }
      .attributions a {
        color: #8fc1ff;
      }
      .loading-message {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
        padding: 0.6rem 1.1rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.85);
        font-size: 0.95rem;
        color: #d7dae0;
      }
      .terrain-controls {
        position: absolute;
        top: calc(0.5rem + env(safe-area-inset-top));
        right: calc(0.5rem + env(safe-area-inset-right));
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0.6rem 0.75rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.8);
        font-size: 0.78rem;
        color: #d7dae0;
      }
      .terrain-controls .exaggeration {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .terrain-controls .exaggeration input[type="range"] {
        width: 7rem;
        /* the input box is the touch hit area for the thumb */
        height: 44px;
      }
      .terrain-controls .exaggeration-value {
        min-width: 2.2rem;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .terrain-controls .quality-toggle {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: #8fc1ff;
      }
      .terrain-controls .quality-warning {
        margin: 0;
        max-width: 12rem;
        font-size: 0.7rem;
        color: #e3b567;
      }
      .pick-panel {
        position: absolute;
        right: calc(0.5rem + env(safe-area-inset-right));
        bottom: calc(0.5rem + env(safe-area-inset-bottom));
        max-width: min(16rem, calc(100vw - 1rem));
        padding: 0.55rem 0.75rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.85);
        font-size: 0.8rem;
        color: #d7dae0;
      }
      .pick-panel-close {
        position: absolute;
        top: 0;
        right: 0;
        width: 44px;
        height: 44px;
        border: none;
        background: none;
        color: #9aa3b2;
        font-size: 1rem;
        line-height: 1;
        padding: 0;
        cursor: pointer;
      }
      .pick-panel-close:hover {
        color: #e8e9eb;
      }
      .pick-panel [hidden] {
        display: none;
      }
      .pick-panel-data {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.1rem 0.6rem;
        margin: 0 2rem 0 0;
      }
      .pick-panel-data dt {
        color: #9aa3b2;
      }
      .pick-panel-data dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .pick-panel-note,
      .pick-panel-hint {
        margin: 0.4rem 0 0;
        font-size: 0.68rem;
        color: #9aa3b2;
      }
      /* Places layer: full-screen marker overlay, purely visual — marker
         taps are resolved by the canvas pick path (places.pickAt). Its
         pointer-events opt-out lives in the `#overlay > …` rule above,
         which out-specifies `#overlay > *`. */
      .places-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 3;
      }
      #overlay .place-marker {
        pointer-events: none;
        touch-action: none;
      }
      .place-marker {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
      }
      .place-marker-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        border-radius: 50%;
        background: #ffb74d;
        border: 1.5px solid #4a2f00;
        box-shadow:
          0 0 0 1px rgb(0 0 0 / 0.35),
          0 1px 3px rgb(0 0 0 / 0.5);
      }
      .place-marker-label {
        position: absolute;
        top: 50%;
        left: 10px;
        transform: translateY(-50%);
        padding: 0.15rem 0.45rem;
        border-radius: 0.4rem;
        background: rgb(23 25 29 / 0.85);
        color: #e8e9eb;
        font-size: 0.72rem;
        font-weight: 600;
        white-space: nowrap;
        pointer-events: none;
      }
      .place-marker-label--hidden {
        display: none;
      }
      /* Place card: reuses .pick-panel; card-specific bits only. The
         overlay layer is click-through, so the card opts back in and
         keeps normal scroll/pinch behavior. */
      .place-card {
        pointer-events: auto;
        touch-action: manipulation;
      }
      .place-card-name {
        margin: 0;
        padding-right: 2rem;
        font-size: 0.9rem;
        color: #e8e9eb;
      }
      .place-card-desc {
        margin: 0.15rem 0 0.4rem;
        padding-right: 2rem;
        font-size: 0.75rem;
        line-height: 1.45;
        color: #d7dae0;
      }
      .place-card-desc--empty {
        color: #9aa3b2;
        font-style: italic;
      }
      .place-card-links {
        margin: 0.45rem 0 0;
        font-size: 0.75rem;
      }
      .place-card-links a {
        color: #8fc1ff;
      }
      /* The card is wider than the pick panel (photos need room) and can
         grow tall when expanded, so it scrolls internally. */
      .place-card {
        width: min(26rem, calc(100vw - 1rem));
        max-width: none;
        max-height: calc(100dvh - 1rem);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      /* Photo strip: horizontal swipeable thumbnails, credit under each. */
      .place-card-photos {
        display: flex;
        gap: 0.6rem;
        margin: 0 1.8rem 0.45rem 0;
        overflow-x: auto;
        overscroll-behavior: contain;
        scroll-snap-type: x proximity;
        touch-action: pan-x;
        scrollbar-width: thin;
      }
      .place-card-photo {
        flex: none;
        scroll-snap-align: start;
        margin: 0;
      }
      .place-card-photo-button {
        display: block;
        padding: 0;
        border: none;
        border-radius: 0.35rem;
        background: #101216;
        cursor: zoom-in;
      }
      .place-card-photo-button img {
        display: block;
        height: 170px;
        width: auto;
        border-radius: 0.35rem;
      }
      .place-card-photo-button:focus-visible {
        outline: 2px solid #8fc1ff;
        outline-offset: 2px;
      }
      .place-card-photo-credit {
        margin-top: 0.15rem;
        font-size: 0.62rem;
        color: #9aa3b2;
        white-space: nowrap;
      }
      .place-card-photo-credit a {
        color: #8fc1ff;
      }
      .place-card-more {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0;
        border: none;
        background: none;
        color: #8fc1ff;
        font: inherit;
        font-size: 0.78rem;
        cursor: pointer;
      }
      .place-card-more::after {
        content: "▾";
        margin-left: 0.35rem;
      }
      .place-card-more[aria-expanded="true"]::after {
        content: "▴";
      }
      .place-card-extract {
        margin: 0.3rem 0 0;
        padding: 0.15rem 0 0.15rem 0.6rem;
        border-left: 3px solid rgb(143 193 255 / 0.5);
      }
      .place-card-extract p {
        margin: 0;
        font-size: 0.75rem;
        line-height: 1.5;
      }
      .place-card-extract-source {
        margin: 0.25rem 0 0;
        font-size: 0.68rem;
        color: #9aa3b2;
      }
      .place-card-extract-source a {
        color: #8fc1ff;
      }
      .place-card-facts {
        margin-top: 0.4rem;
      }
      .place-card-facts-source {
        margin: 0.25rem 0 0;
        font-size: 0.68rem;
        color: #9aa3b2;
      }
      .place-card-facts-source a {
        color: #8fc1ff;
      }
      /* Photo lightbox: full-screen dialog over the overlay. Its
         touch-action opt-out needs the #overlay > selector to out-
         specify `#overlay > *`, like .places-layer's. */
      #overlay > .photo-lightbox {
        touch-action: none;
      }
      .photo-lightbox {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: rgb(0 0 0 / 0.92);
      }
      .photo-lightbox[hidden] {
        display: none;
      }
      .photo-lightbox-stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* every gesture on the image goes to the pointer handlers
           (pan when zoomed, swipe to navigate, pinch to zoom) */
        touch-action: none;
      }
      .photo-lightbox-image {
        max-width: 94vw;
        max-height: 78vh;
        width: auto;
        height: auto;
        border-radius: 0.4rem;
      }
      .photo-lightbox-caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom));
        background: rgb(0 0 0 / 0.55);
        font-size: 0.72rem;
        color: #d7dae0;
        text-align: center;
      }
      .photo-lightbox-caption a {
        color: #8fc1ff;
      }
      .photo-lightbox-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 64px;
        border: none;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.6);
        color: #e8e9eb;
        font-size: 1.6rem;
        cursor: pointer;
      }
      .photo-lightbox-prev {
        left: calc(0.5rem + env(safe-area-inset-left));
      }
      .photo-lightbox-next {
        right: calc(0.5rem + env(safe-area-inset-right));
      }
      .photo-lightbox-close {
        position: absolute;
        top: calc(0.5rem + env(safe-area-inset-top));
        right: calc(0.5rem + env(safe-area-inset-right));
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 50%;
        background: rgb(23 25 29 / 0.6);
        color: #e8e9eb;
        font-size: 1.3rem;
        line-height: 1;
        cursor: pointer;
      }
      /* "Lugares" control: a button that opens the place list — the
         keyboard path to each card now that markers are visual only —
         plus a checkbox that shows/hides the map markers. Lives inside
         the controls panel like the quality toggle. */
      .places-control {
        align-self: flex-start;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .places-toggle {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0;
        border: none;
        background: none;
        color: #8fc1ff;
        font: inherit;
        cursor: pointer;
      }
      .places-toggle::after {
        content: "▾";
        margin-left: 0.35rem;
      }
      .places-toggle[aria-expanded="true"]::after {
        content: "▴";
      }
      .places-toggle:focus-visible {
        outline: 2px solid #8fc1ff;
        outline-offset: 2px;
      }
      .places-list {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        max-width: 14rem;
        padding: 0.4rem 0.5rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.9);
        font-size: 0.75rem;
      }
      .places-list[hidden] {
        display: none;
      }
      .places-list-visible {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        min-height: 44px;
      }
      .places-list-items {
        margin: 0;
        padding: 0;
        list-style: none;
        max-height: min(45vh, 18rem);
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: manipulation;
      }
      .places-list-item {
        display: block;
        width: 100%;
        min-height: 44px;
        padding: 0 0.4rem;
        border: none;
        border-radius: 0.35rem;
        background: none;
        color: #e8e9eb;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .regions-controls {
        position: absolute;
        top: calc(0.5rem + env(safe-area-inset-top));
        left: calc(0.5rem + env(safe-area-inset-left));
        max-width: min(15rem, calc(100vw - 1rem));
        padding: 0.5rem 0.65rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.8);
        font-size: 0.78rem;
        color: #d7dae0;
      }
      .regions-controls [hidden] {
        display: none;
      }
      .regions-toggle {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        min-height: 44px;
        cursor: pointer;
      }
      .regions-toggle input {
        width: 1.1rem;
        height: 1.1rem;
        flex: none;
      }
      .regions-legend {
        list-style: none;
        margin: 0.1rem 0 0;
        padding: 0;
      }
      .region-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
        min-height: 44px;
        padding: 0 0.2rem;
        border: none;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .places-list-item:hover {
        background: rgb(255 255 255 / 0.08);
      }
      .places-list-item:focus-visible {
        outline: 2px solid #8fc1ff;
        outline-offset: -2px;
      }
      .places-control--floating {
        position: absolute;
        top: calc(0.5rem + env(safe-area-inset-top));
        left: calc(0.5rem + env(safe-area-inset-left));
        padding: 0.4rem 0.6rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.8);
        z-index: 4;
      }
      .region-item:hover .region-name {
        text-decoration: underline;
      }
      .region-swatch {
        width: 0.85rem;
        height: 0.85rem;
        border-radius: 0.2rem;
        flex: none;
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.3);
      }
      .region-card {
        position: relative;
        margin-top: 0.3rem;
        padding-top: 0.4rem;
        border-top: 1px solid rgb(255 255 255 / 0.12);
      }
      .region-card h3 {
        margin: 0 2rem 0.15rem 0;
        font-size: 0.92rem;
      }
      .region-card p {
        margin: 0.3rem 0;
      }
      .region-card-departments,
      .region-card-note {
        font-size: 0.7rem;
        color: #b9bec7;
      }
      .region-card-note {
        color: #e3b567;
      }
      .region-card-source {
        font-size: 0.7rem;
      }
      .region-card-source a {
        color: #8fc1ff;
      }
      .region-card-close {
        position: absolute;
        top: 0;
        right: -0.35rem;
        width: 44px;
        height: 44px;
        border: none;
        background: none;
        color: #9aa3b2;
        font-size: 1rem;
        line-height: 1;
        padding: 0;
        cursor: pointer;
      }
      .region-card-close:hover {
        color: #e8e9eb;
      }
      .debug-overlay {
        position: absolute;
        top: calc(0.5rem + env(safe-area-inset-top));
        left: calc(0.5rem + env(safe-area-inset-left));
        padding: 0.4rem 0.6rem;
        border-radius: 0.5rem;
        background: rgb(23 25 29 / 0.8);
        font-family: ui-monospace, monospace;
        font-size: 0.66rem;
        line-height: 1.45;
        color: #b9bec7;
        white-space: pre;
        pointer-events: none;
      }
      @media (max-width: 640px) {
        .attributions {
          font-size: 0.66rem;
        }
        /* Bottom sheet: anchored to the screen edge so the center of the
           map stays visible and reachable. */
        .pick-panel {
          left: 0;
          right: 0;
          bottom: 0;
          max-width: none;
          border-radius: 0.75rem 0.75rem 0 0;
          padding-bottom: calc(0.55rem + env(safe-area-inset-bottom));
        }
        .pick-panel-close {
          right: calc(0.25rem + env(safe-area-inset-right));
        }
        /* The card sheet never covers more than ~55% of the viewport —
           the map stays usable above it; the photos strip shrinks. */
        .place-card {
          width: auto;
          max-height: 55vh;
        }
        .place-card-photo-button img {
          height: 110px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
